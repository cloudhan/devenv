[workspace]
channels = ["conda-forge"]
name = "cuda13"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
pip = ">=25.3,<26"
ninja = ">=1.13.2,<2"
cmake = ">=4.3.2,<5"
nodejs = ">=24.14.0,<25"

numpy = ">=2.4.1,<3"
ipython = ">=9.9.0,<10"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.0,<4"
einops = ">=0.8.1,<0.9"
tqdm = ">=4.67.1,<5"
pytest = ">=9.0.2,<10"
pytest-flakefinder = ">=1.1.0,<2"
nvidia-ml-py = ">=13.610.43,<14"
apache-tvm-ffi = ">=0.1.9,<0.2"
requests = ">=2.34.2,<3"
pre_commit = ">=4.6.0,<5"

[pypi-dependencies]

torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchao = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-cutlass-dsl = { version = ">=4.5.2, <5", extras = ["cu13"] }
